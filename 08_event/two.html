<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Time Out</title>
</head>
<body>
    <h1>Hello World</h1>

    <button id="button">Stop</button>

    <script>

        function sayHello(){
           document.querySelector('h1').innerHTML = "Welcome"
            
        }
     const changeMe = setTimeout( sayHello,2000)

     document.querySelector('#button').addEventListener('click',function(){


        clearTimeout(changeMe)

     })

    </script>
</body>
</html>
