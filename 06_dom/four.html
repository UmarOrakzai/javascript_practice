    <body>
       
        <div>
            <ul class="languages">
                <li>JavaScript</li>
            </ul>
        </div>
        <script >
               //Add New Element to the List
            function addLanguage(language) {
                const ul = document.querySelector('.languages');
                const li = document.createElement('li');
                let createLangName = document.createTextNode(language);
                li.appendChild(createLangName);
                ul.appendChild(li);
              
            }

            /* const languagesNames = ['Python', 'Java', 'C++', 'C#',
             'Ruby', 'Go', 'Swift', 'Kotlin', 'PHP'];  

            languagesNames.forEach(function(language) {
                addLanguage(language);
            });*/
             addLanguage('Python');
            addLanguage('Java');
            addLanguage('C++');
           
            //Edit the element in the list
           const secondLanguage = document.querySelector(' li:nth-child(2)');
          console.log(secondLanguage);
          const newli = document.createElement('li');
          newli.textContent = 'mojo';
            secondLanguage.replaceWith(newli);

            //Eidit the element in the list
            const firstLanguage = document.querySelector('li:first-child');
            firstLanguage.textContent = 'TypeScript';

            //Remove the element from the list
            const lastLanguage = document.querySelector('li:last-child');
            lastLanguage.remove();
            
        </script>
    </body>
