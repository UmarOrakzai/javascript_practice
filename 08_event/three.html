<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impressive Stopwatch</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        background-size: 200% 200%;
        animation: gradientMove 8s ease infinite;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .stopwatch {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 40px 50px;
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        color: white;
    }

    .stopwatch h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 2px;
        text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .time {
        font-size: 80px;
        font-weight: 700;
        letter-spacing: 3px;
        margin-bottom: 40px;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    .time span {
        display: inline-block;
        min-width: 110px;
    }

    .colon {
        animation: blink 1s step-start infinite;
    }

    @keyframes blink {
        50% { opacity: 0; }
    }

    .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    button {
        padding: 15px 35px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        color: white;
    }

    button:active {
        transform: scale(0.92);
    }

    .start {
        background: linear-gradient(135deg, #00f260, #0575e6);
        box-shadow: 0 8px 25px rgba(0, 242, 96, 0.4);
    }
    .start:hover {
        box-shadow: 0 12px 35px rgba(0, 242, 96, 0.6);
        transform: translateY(-3px);
    }

    .stop {
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        box-shadow: 0 8px 25px rgba(255, 65, 108, 0.4);
    }
    .stop:hover {
        box-shadow: 0 12px 35px rgba(255, 65, 108, 0.6);
        transform: translateY(-3px);
    }

    .reset {
        background: linear-gradient(135deg, #7f7fd5, #91eae4);
        box-shadow: 0 8px 25px rgba(127, 127, 213, 0.4);
    }
    .reset:hover {
        box-shadow: 0 12px 35px rgba(127, 127, 213, 0.6);
        transform: translateY(-3px);
    }

    /* Mobile responsive */
    @media (max-width: 600px) {
        .stopwatch {
            padding: 30px 25px;
        }
        .time {
            font-size: 50px;
        }
        .time span {
            min-width: 70px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
        }
    }
</style>
</head>
<body>

    <div class="stopwatch">
        <h1>60:00</h1>
        
       
        <div class="buttons">
            <button class="start" id="start">Start</button>
            <button class="stop" id="stop">Stop</button>
            
        </div>
    </div>


    

    <script>
       let timeStart ;
       let Time = 60;
      const sayHello = function(){
      document.querySelector('h1').innerHTML = `${Time = Time-1}:00`;
       if(Time < 1 ){
         clearInterval(timeStart);
         document.querySelector('h1').innerHTML = 'Time is Over'

     }
        console.log(Time);
        
        
     }
     
      document. querySelector('#start').addEventListener('click', function(){
        timeStart = setInterval(sayHello, 1000);
        

      })
    

     document.querySelector('#stop').addEventListener('click', function(){
        console.log('Stoped');
        
        clearInterval(timeStart);
     })

    
       
    </script>
</body>
</html>
