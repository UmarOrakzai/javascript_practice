<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Card</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #74b9ff, #0984e3);
    }

    .weather-card {
        background: rgba(255, 255, 255, 0.95);
        width: 320px;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        text-align: center;
    }

    .city {
        font-size: 24px;
        font-weight: bold;
        color: #2d3436;
        margin-bottom: 5px;
    }

    .date {
        font-size: 14px;
        color: #636e72;
        margin-bottom: 20px;
    }

    .temp {
        font-size: 60px;
        font-weight: bold;
        color: #0984e3;
        margin: 10px 0;
    }

    .weather-desc {
        font-size: 18px;
        color: #2d3436;
        margin-bottom: 20px;
        text-transform: capitalize;
    }

    .details {
        display: flex;
        justify-content: space-around;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #ddd;
    }

    .detail-box {
        text-align: center;
    }

    .detail-box .label {
        font-size: 12px;
        color: #636e72;
    }

    .detail-box .value {
        font-size: 16px;
        font-weight: bold;
        color: #2d3436;
        margin-top: 5px;
    }

    .icon {
        font-size: 80px;
        margin: 10px 0;
    }
</style>
</head>
<body>

<div class="weather-card">
    <div class="city">Lahore, PK</div>
    <div class="date">22 August 2026</div>
    
    <div class="icon">☀️</div>
    <div class="temp">34°C</div>
    <div class="weather-desc">Saaf Aasman</div>
    
    <div class="details">
        <div class="detail-box">
            <div class="label">Nami</div>
            <div class="value">45%</div>
        </div>
        <div class="detail-box">
            <div class="label">Hawa</div>
            <div class="value">3.6 m/s</div>
        </div>
    </div>
</div>

</body>

<script src="promise.js" >

</script>
</html>
