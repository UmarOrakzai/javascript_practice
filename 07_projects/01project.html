<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Button Color Changer</title>
  <style>
    body {
      text-align: center;
      margin-top: 100px;
      font-family: Arial, sans-serif;
      transition: background-color 0.5s ease;
    }

    h1 {
      margin-bottom: 30px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      color: white;
    }

    .red { background-color: red; }
    .blue { background-color: blue; }
    .green { background-color: green; }
    .purple { background-color: purple; }
    .orange { background-color: orange; }
    .btn { background-color: black;}
  </style>
</head>
<body>

  <h1>Choose a Color to Change Background Color </h1>

  <div class="btn-container">
    <button class="red" id="red">Red</button>
    <button class="blue" id="blue">Blue</button>
    <button class="green" id="green">Green</button>
    <button class="purple" id="purple">Purple</button>
    <button class="orange" id="orange">Orange</button>
    <button class="btn" id="black">Black </button>
  </div>

  <script>
    const buttons = document.querySelectorAll("button");

    buttons.forEach((button) => {
      button.addEventListener("click", function (e) {
        //console.log(e);
        console.log(e.target);

        if(e.target.id ==='blue'){
          document.body.style.backgroundColor = e.target.id
        }
        else if(e.target.id ==='red'){
          document.body.style.backgroundColor = e.target.id
        }
        else if(e.target.id ==='green'){
          document.body.style.backgroundColor = e.target.id
        }
        else if(e.target.id ==='purple'){
          document.body.style.backgroundColor = e.target.id
        }
        else if(e.target.id ==='orange'){
          document.body.style.backgroundColor = e.target.id
        }
        else if(e.target.id ==='black'){
          document.body.style.backgroundColor = e.target.id
        }
        
      
      });
    });

  </script>




</body>
</html>
