<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Height & Weight Result</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      background: green;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: darkgreen;
    }

    .result {
      margin-top: 15px;
      padding: 12px;
      background: #e9e9e9;
      border-radius: 6px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Height & Weight</h2>

    <form>
      <input type="number" id="height" placeholder="Enter Height (cm)" required>
      <input type="number" id="weight" placeholder="Enter Weight (kg)" required>
      <button type="submit">Calculate</button>
    </form>

    <!-- RESULT SPACE -->
    <div class="result">
      <h1 id="result">Result will appear here...</h1>
      <h3 id="range"></h3>
    
    </div>
  </div>

<script src="Index.js">

    
   

       
  
</script>
</body>
</html>
