<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667EEA, #764BA2);
            padding: 20px;
        }

        /* FORM CSS */
        .search-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-box input {
            padding: 14px 20px;
            width: 300px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: rgba(255,255,255,0.9);
        }

        .search-box button {
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: white;
            color: #764BA2;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box button:hover {
            transform: scale(1.05);
            background: #764BA2;
            color: white;
        }

        /* CARD CSS */
        .card {
            width: 340px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            margin-bottom: 20px;
        }

        .card h2 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
        .card p.bio { font-size: 14px; opacity: 0.9; margin-bottom: 20px; }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 25px 0;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }
        .stats div h3 { font-size: 22px; font-weight: 700; }
        .stats div p { font-size: 12px; opacity: 0.8; }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #764BA2;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s;
        }
        .btn:hover { background: #764BA2; color: white; transform: scale(1.05); }
    </style>
</head>
<body>
    
    <!-- FORM -->
    <form class="search-box" >
        <input   type="text" placeholder="Enter GitHub Username">
        <button type="submit">Search</button>
    </form>

    <!-- CARD - Dummy data dala hai demo ke liye -->
    <div class="card">
        <img id="profile-pic" src="https://avatars.githubusercontent.com/u/9919?s=200&v=4" alt="Profile">
        <h2>GitHub</h2>
        <p class="bio">How people build software</p>
        
        <div class="stats">
            <div>
                <h3 id="p2">500+</h3>
                <p >Repos</p>
            </div>
            <div>
                <h3 id="p3">1M</h3>
                <p >Followers</p>
            </div>
            <div>
                <h3 id="p4">0</h3>
                <p >Following</p>
            </div>
        </div>

        <a href="https://github.com/UmarOrakzai" class="btn">View Profile</a>
    </div>

</body>
<script>
       
    const form = document.querySelector('form')
           
      

  form.addEventListener('submit', function(e){
        e.preventDefault();

        const input = form.querySelector('input').value;


         let RequestUrl = `https://api.github.com/users/${input}`
         const xhr = new XMLHttpRequest();
         xhr.open('GET', RequestUrl);
         xhr.send()
         xhr.onreadystatechange = function(){
            console.log(xhr.readyState);
            if(xhr.readyState === 4){
                 data = JSON.parse(this.responseText)
                 console.log(data);
                 
                
                 
            document.getElementById('profile-pic').src = data.avatar_url
            document.querySelector('h2').innerHTML = data.name
            document.querySelector('p').innerHTML = data.bio
            document.getElementById('p2').innerHTML = data.public_repos
            document.getElementById('p3').innerHTML = data.followers
            document.getElementById('p4').innerHTML = data.following




 
                 

            }
         }
       


    })

  

  
</script>

    

</html>
